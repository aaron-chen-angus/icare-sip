<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05070d">
    <meta name="description" content="SIP//LAB — 2-Minute Step-in-Place Biomechanics Lab. Browser-only computer-vision assessment.">
    <title>SIP//LAB — Step-in-Place Biomechanics Lab</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- TRON backdrop (hidden during live test via body.live) -->
    <div class="tron-bg" aria-hidden="true">
        <div class="grid-floor"></div>
        <div class="particles"></div>
        <div class="scanlines"></div>
    </div>

    <!-- Rotate-to-portrait full-screen overlay (only when test not running) -->
    <div id="rotate-overlay" aria-hidden="true">
        <div class="icon">📱</div>
        <h2>Rotate to Portrait</h2>
        <p>SIP//LAB runs in portrait orientation. Please turn your device upright.</p>
    </div>
    <!-- mid-test landscape warning banner -->
    <div class="rotate-banner">↻ ROTATE TO PORTRAIT FOR BEST TRACKING</div>

    <!-- app mounts here -->
    <main id="app" role="main"></main>

    <!-- hidden video + canvas reused by the pose engine (moved into the live DOM at runtime) -->

    <!-- Visible error banner: surface any script/runtime error on the device itself -->
    <div id="fatal-error" style="display:none;position:fixed;inset:0;z-index:9999;background:#0a0410;color:#ffd0d0;font:14px/1.5 monospace;padding:18px;overflow:auto"></div>
    <script>
    (function () {
        function show(msg) {
            var b = document.getElementById('fatal-error');
            if (!b) return;
            b.style.display = 'block';
            b.textContent = 'SIP//LAB error (screenshot this):\n\n' + msg +
                '\n\nReload the page. If this persists, the MediaPipe CDN or a script may be blocked on this network.';
        }
        window.addEventListener('error', function (e) {
            show((e.message || 'script error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
            show('Unhandled promise: ' + ((e.reason && (e.reason.message || e.reason)) || 'unknown'));
        });
    })();
    </script>

    <!-- Scripts in dependency order (no bundler, classic tags) -->
    <script src="js/config.js"></script>
    <script src="js/schema.js"></script>
    <script src="js/geom.js"></script>
    <script src="js/analysis.js"></script>
    <script src="js/export.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/pose-engine.js"></script>
    <script src="js/screen-live.js"></script>
    <script src="js/app.js"></script>
    <script src="js/screen-results.js"></script>
</body>
</html>
